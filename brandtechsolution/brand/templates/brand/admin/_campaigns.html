<div id="campaigns" class="section hidden">
    <div class="flex justify-between items-center mb-8 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-white">Campaigns</h2>
            <p class="text-gray-500 text-sm">Compose and send bulk email</p>
        </div>
        <button onclick="showAddForm('campaign')" class="bg-brand-green hover:bg-green-500 text-black font-semibold px-5 py-2.5 rounded-lg flex items-center"><i class="fas fa-plus mr-2"></i>New Campaign</button>
    </div>

    <div id="campaignForm" class="bg-dark-card border border-dark-border rounded-xl p-6 mb-8 hidden">
        <h3 class="text-lg font-bold text-white mb-6 border-b border-dark-border pb-4">New Campaign</h3>
        <form id="addCampaignForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Campaign name (internal)</label>
                <input type="text" name="name" required class="w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-blue">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Use a template (optional)</label>
                <select id="campaignTemplate" onchange="applyTemplate()" class="w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-blue">
                    <option value="">— none —</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Subject</label>
                <input type="text" name="subject" id="campaignSubjectInput" required class="w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-blue">
                <select id="campaignSubjectPlaceholderMenu"
                    class="mt-2 bg-[#06090F] border border-dark-border rounded px-2 py-1 text-xs text-gray-300"></select>
            </div>
            <div>
                <div class="flex items-center justify-between mb-2 gap-2">
                    <label class="block text-sm font-medium text-gray-400">Email body</label>
                    <div class="flex items-center gap-2">
                        <select id="campaignPlaceholderMenu"
                            class="bg-[#06090F] border border-dark-border rounded px-2 py-1 text-xs text-gray-300"></select>
                        <button type="button" id="campaignSourceToggle"
                            class="px-3 py-1 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Source</button>
                        <button type="button" id="campaignPreviewBtn"
                            class="px-3 py-1 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Preview</button>
                    </div>
                </div>
                <div id="campaignEditorWrap">
                    <div id="campaignEditorContainer"></div>
                    <textarea id="campaignSourceTextarea" rows="12"
                        class="hidden w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-brand-blue"></textarea>
                </div>
                <div id="campaignUnknownWarning"
                    class="hidden mt-2 text-xs text-yellow-400 bg-yellow-900/20 border border-yellow-900/40 rounded px-3 py-2"></div>
                <iframe id="campaignPreviewFrame" title="Email preview"
                    class="hidden w-full h-80 mt-3 rounded-lg border border-dark-border bg-white" sandbox=""></iframe>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-dark-border">
                <button type="button" onclick="hideAddForm('campaign')" class="px-6 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5">Cancel</button>
                <button type="submit" class="bg-brand-green hover:bg-green-500 text-black px-6 py-2.5 rounded-lg font-semibold">Create Draft</button>
            </div>
        </form>
    </div>

    <div id="campaignsList" class="space-y-4"></div>

    <div id="recipientsModal" class="hidden fixed inset-0 z-50 bg-black/70 p-4 overflow-y-auto">
        <div class="max-w-3xl mx-auto my-8 bg-dark-card border border-dark-border rounded-xl">
            <div class="flex justify-between items-center px-6 py-4 border-b border-dark-border">
                <div>
                    <h3 class="text-lg font-bold text-white">Recipients</h3>
                    <p id="recipientsSubtitle" class="text-xs text-gray-500"></p>
                </div>
                <button type="button" onclick="closeRecipients()"
                    class="text-gray-400 hover:text-white px-2 py-1 rounded hover:bg-white/5"
                    aria-label="Close recipients"><i class="fas fa-times"></i></button>
            </div>

            <div class="px-6 py-4 space-y-4">
                <div class="flex flex-wrap gap-2 items-center">
                    <input type="search" id="recipientsSearch" placeholder="Search email or name"
                        class="flex-1 min-w-[12rem] bg-[#06090F] border border-dark-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-blue">
                    <button type="button" onclick="checkRecipientDomains()"
                        class="px-3 py-2 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Check domains</button>
                    <button type="button" onclick="removeInvalidRecipients()"
                        class="px-3 py-2 text-xs rounded border border-red-900/60 text-red-400 hover:bg-red-900/20">Remove all invalid</button>
                </div>

                <div id="recipientsSummary" class="hidden text-xs text-gray-400 bg-white/5 border border-dark-border rounded px-3 py-2"></div>

                <div id="recipientsList" class="divide-y divide-dark-border border border-dark-border rounded"></div>

                <div class="flex justify-between items-center">
                    <button type="button" id="recipientsPrev" onclick="recipientsPage(-1)"
                        class="px-3 py-1.5 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Previous</button>
                    <span id="recipientsPageInfo" class="text-xs text-gray-500"></span>
                    <button type="button" id="recipientsNext" onclick="recipientsPage(1)"
                        class="px-3 py-1.5 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Next</button>
                </div>

                <form id="addRecipientForm" class="flex flex-wrap gap-2 pt-4 border-t border-dark-border">
                    <input type="email" name="email" required placeholder="add an address"
                        class="flex-1 min-w-[12rem] bg-[#06090F] border border-dark-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-blue">
                    <input type="text" name="name" placeholder="name (optional)"
                        class="flex-1 min-w-[9rem] bg-[#06090F] border border-dark-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-blue">
                    <button type="submit"
                        class="bg-brand-green hover:bg-green-500 text-black text-xs font-semibold px-4 py-2 rounded">Add</button>
                </form>
            </div>
        </div>
    </div>
</div>
