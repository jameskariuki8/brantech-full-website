<div id="templates" class="section hidden">
    <div class="flex justify-between items-center mb-8 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-white">Email Templates</h2>
            <p class="text-gray-500 text-sm">Reusable email content</p>
        </div>
        <button onclick="showAddForm('template')" class="bg-brand-blue hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg flex items-center transition-colors"><i class="fas fa-plus mr-2"></i>New Template</button>
    </div>
    <div id="templateForm" class="bg-dark-card border border-dark-border rounded-xl p-6 mb-8 hidden">
        <h3 class="text-lg font-bold text-white mb-6 border-b border-dark-border pb-4">New Template</h3>
        <form id="addTemplateForm" class="space-y-4">
            <input type="hidden" name="id">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Name</label>
                <input type="text" name="name" required class="w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-blue">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Subject</label>
                <input type="text" name="subject" id="templateSubjectInput" required class="w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-blue">
                <select id="templateSubjectPlaceholderMenu"
                    class="mt-2 bg-[#06090F] border border-dark-border rounded px-2 py-1 text-xs text-gray-300"></select>
            </div>
            <div>
                <div class="flex items-center justify-between mb-2 gap-2">
                    <label class="block text-sm font-medium text-gray-400">Email body</label>
                    <div class="flex items-center gap-2">
                        <select id="templatePlaceholderMenu"
                            class="bg-[#06090F] border border-dark-border rounded px-2 py-1 text-xs text-gray-300"></select>
                        <button type="button" id="templateSourceToggle"
                            class="px-3 py-1 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Source</button>
                        <button type="button" id="templatePreviewBtn"
                            class="px-3 py-1 text-xs rounded border border-dark-border text-gray-300 hover:text-white hover:bg-white/5">Preview</button>
                    </div>
                </div>
                <div id="templateEditorWrap">
                    <div id="templateEditorContainer"></div>
                    <textarea id="templateSourceTextarea" rows="12"
                        class="hidden w-full bg-[#06090F] border border-dark-border rounded-lg px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-brand-blue"></textarea>
                </div>
                <div id="templateUnknownWarning"
                    class="hidden mt-2 text-xs text-yellow-400 bg-yellow-900/20 border border-yellow-900/40 rounded px-3 py-2"></div>
                <iframe id="templatePreviewFrame" title="Email preview"
                    class="hidden w-full h-80 mt-3 rounded-lg border border-dark-border bg-white" sandbox=""></iframe>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-dark-border">
                <button type="button" onclick="hideAddForm('template')" class="px-6 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5">Cancel</button>
                <button type="submit" class="bg-brand-blue hover:bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium">Save Template</button>
            </div>
        </form>
    </div>
    <div id="templatesList" class="space-y-4"></div>
</div>
