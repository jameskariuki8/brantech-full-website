{% comment %}
The shell every themed transactional message extends.

Tables and inline-ish styling on purpose: email clients are not browsers, and
flexbox, grid and <style> blocks are all unreliable. inline_email_css folds
BASE_EMAIL_CSS into the tags before this is sent, so classes here would be
ignored -- what survives is the structure and the style attributes.

Colours follow the site: #050811 for the header, #007AFF for links (which
BASE_EMAIL_CSS already uses), and an accent the caller supplies so a failure
and a recovery do not look identical at a glance on a phone.
{% endcomment %}<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">

          <tr>
            <td style="background:#050811;padding:20px 24px;">
              <span style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:bold;">Teklora</span>
              <span style="color:{{ accent|default:'#00FF94' }};font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:bold;">.</span>
              <span style="color:#9ca3af;font-family:Arial,Helvetica,sans-serif;font-size:12px;float:right;padding-top:4px;">{{ header_label|default:"System notice" }}</span>
            </td>
          </tr>

          <tr>
            <td style="height:4px;background:{{ accent|default:'#00FF94' }};font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td style="padding:24px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:16px 24px;">
              <p style="margin:0;font-size:12px;color:#6b7280;">
                Sent automatically by the Teklora platform because you hold
                the <strong>{{ capability|default:"receive_alerts" }}</strong> capability.
                {% if manage_url %}Change who receives these in the <a href="{{ manage_url }}">admin panel</a>.{% endif %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
