services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
    volumes:
      - ./data/media:/app/brandtechsolution/media
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Token comes from cloudflared.env (TUNNEL_TOKEN), kept out of argv and out
    # of the web container's environment. cloudflared reads TUNNEL_TOKEN from env.
    command: tunnel --no-autoupdate run
    env_file: ./cloudflared.env
    depends_on:
      - web
